name: Release Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            jpackage_type: msi
          - os: macos-latest
            platform: mac
            jpackage_type: dmg
          - os: ubuntu-latest
            platform: linux
            jpackage_type: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: choco install wixtoolset -y

      - name: Install packaging tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build application jar
        shell: bash
        run: mvn -B -DskipTests -Dexec.skip=true clean package

      - name: Stage jar
        id: stage
        shell: bash
        run: |
          mkdir -p staging
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n 1)
          cp "$JAR" staging/
          echo "jar_name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: bash
        run: |
          mkdir -p dist/installer
          JPACKAGE="$JAVA_HOME/bin/jpackage"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            JPACKAGE="$JPACKAGE.exe"
          fi

          EXTRA_ARGS=()
          case "${{ matrix.platform }}" in
            windows)
              EXTRA_ARGS+=(--win-menu --win-shortcut --win-dir-chooser)
              ;;
            linux)
              EXTRA_ARGS+=(--linux-shortcut)
              ;;
          esac

          "$JPACKAGE" \
            --type "${{ matrix.jpackage_type }}" \
            --name GBUXML \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor GBUXML \
            --input staging \
            --main-jar "${{ steps.stage.outputs.jar_name }}" \
            --main-class com.gbuxml.GBUXMLLauncher \
            --dest dist/installer \
            "${EXTRA_ARGS[@]}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbuxml-${{ matrix.platform }}-installer
          path: dist/installer/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
